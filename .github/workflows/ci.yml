name: CI

# CI runs on the self-hosted Linux runner (16-core, 32GB, real Vulkan device)
# — no billed minutes, persistent local caches, so even cold builds are cheap.
# macOS/Metal and Windows/Vulkan are compiled by release.yml on their own
# self-hosted runners.
# Optional extra Debug leg (catches UB/asserts):
#   build_type: [Release, Debug]

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: self-hosted linux / ${{ matrix.build_type }}
    runs-on: [self-hosted, Linux, X64]

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]

    env:
      # Pinned vcpkg commit — deterministic dep versions.
      VCPKG_COMMIT: 59acc80b235ac2a9457cc8b8c0fddfb9551019a6
      # mass-proto sibling repo — checked out next to mass-worker-llama-cpp
      # via the second actions/checkout step below.
      MASS_PROTO_DIR: ${{ github.workspace }}/mass-proto

    steps:
      - name: Checkout mass-worker-llama-cpp
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: mass-worker-llama-cpp

      - name: Checkout mass-proto (sibling)
        uses: actions/checkout@v7
        with:
          repository: chinese-room-solutions/mass-proto
          # The proto release carrying the protocol-negotiation contract; bump on proto releases.
          ref: v0.3.0
          token: ${{ secrets.GH_PAT }}
          path: mass-proto

      # Self-hosted: caches live on the runner's own disk — no actions/cache
      # round-trips, no 10GB repo cap, no 7-day eviction. ccache is picked up
      # automatically by the project's CMakeLists compiler-launcher probe.
      - name: Point caches at persistent local dirs
        run: |
          mkdir -p "$HOME/.cache/mass-worker/vcpkg-binaries" "$HOME/.cache/mass-worker/ccache"
          {
            echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/mass-worker/vcpkg-binaries,readwrite"
            echo "CCACHE_DIR=$HOME/.cache/mass-worker/ccache"
            echo "CCACHE_MAXSIZE=10G"
          } >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (persistent)
        env:
          # Hide the user's ~/.gitconfig from vcpkg's git: its https->ssh
          # insteadOf rewrite pushes promisor fetches onto SSH, where GitHub's
          # connection-rate throttle resets them. Step-scoped because
          # actions/checkout must WRITE global config and fails on /dev/null.
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          # Persistent treeless clone: vcpkg resolves the manifest's
          # builtin-baseline and port trees via `git show`, lazily fetching
          # missing objects. Keeping the clone (and thus every fetched object
          # plus the bootstrapped tool) across runs means a warm run needs no
          # vcpkg-side network at all. RUNNER_TEMP would be wiped per run.
          V="$HOME/.cache/mass-worker/vcpkg"
          if [ ! -d "$V/.git" ]; then
            git clone --filter=tree:0 --no-checkout https://github.com/microsoft/vcpkg "$V"
          fi
          git -C "$V" rev-parse --verify -q "$VCPKG_COMMIT^{commit}" >/dev/null || git -C "$V" fetch origin
          git -C "$V" checkout -f "$VCPKG_COMMIT"
          "$V/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$V" >> "$GITHUB_ENV"

      # CI mirrors the release Linux leg (Vulkan backend) so a backend compile
      # break is caught here; Metal is only compiled at release time on macOS.
      - name: Configure
        working-directory: mass-worker-llama-cpp
        env:
          # vcpkg install runs inside configure and lazily git-fetches port
          # trees — same insteadOf hazard as the bootstrap step.
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          # Release-only triplet: the default builds every dependency twice
          # (debug+release), which doubles vcpkg time and peak disk/RAM.
          # Host triplet must match or vcpkg treats the build as cross and
          # compiles the grpc/protobuf host tools a second time. Deps stay
          # release even on a Debug app build — fine on Linux (no CRT split).
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            -DVCPKG_HOST_TRIPLET=x64-linux-release \
            -DVCPKG_INSTALL_OPTIONS=--clean-buildtrees-after-build \
            -DMASS_PROTO_DIR="$MASS_PROTO_DIR" \
            -DMASS_WORKER_LLAMA_VULKAN=ON \
            -DMASS_WORKER_LLAMA_METAL=OFF \
            -DMASS_WORKER_LLAMA_CUDA=OFF \
            -DMASS_WORKER_WERROR=ON

      - name: Build
        working-directory: mass-worker-llama-cpp
        run: cmake --build build -j

      - name: Test
        working-directory: mass-worker-llama-cpp
        run: ctest --test-dir build --output-on-failure -j

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-self-hosted-${{ matrix.build_type }}
          path: |
            mass-worker-llama-cpp/build/CMakeFiles/CMakeOutput.log
            mass-worker-llama-cpp/build/CMakeFiles/CMakeError.log
            mass-worker-llama-cpp/build/vcpkg-manifest-install.log
          if-no-files-found: ignore
